<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD Sports</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/navbar.css">
    <link rel="stylesheet" href="./assets/css/footer.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400&display=swap">
    <link rel="stylesheet" href="./assets/css/card.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">

                <a href="./index.html" class="navbar-brand">
                    <img src="./assets/imagens/logo.png" alt="logo" class="logo-img">
                    PD Sports
                </a>

                <ul class="navbar-nav me-auto d-none d-lg-flex">
                    <li class="nav-item">
                        <a href="./index.html" class="nav-link active" aria-current="page">
                            Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Produtos</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <form class="d-none d-lg-flex" role="search">
                        <input type="search" name="q" class="form-control" placeholder="Buscar produtos..."
                            aria-label="Buscar produtos">
                    </form>

                    <button class="btn text-white d-lg-none p-2" type="button" data-bs-toggle="collapse"
                        data-bs-target="#buscaMobile" aria-controls="buscaMobile" aria-expanded="false"
                        aria-label="Abrir busca">
                        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path
                                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                            </svg></span>
                    </button>
                    <a href="#" class="text-white" aria-label="Carrinho">
                        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                fill="currentColor" class="bi bi-cart4" viewBox="0 0 16 16">
                                <path
                                    d="M0 2.5A.5.5 0 0 1 .5 2H2a.5.5 0 0 1 .485.379L2.89 4H14.5a.5.5 0 0 1 .485.621l-1.5 6A.5.5 0 0 1 13 11H4a.5.5 0 0 1-.485-.379L1.61 3H.5a.5.5 0 0 1-.5-.5M3.14 5l.5 2H5V5zM6 5v2h2V5zm3 0v2h2V5zm3 0v2h1.36l.5-2zm1.11 3H12v2h.61zM11 8H9v2h2zM8 8H6v2h2zM5 8H3.89l.5 2H5zm0 5a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0m9-1a1 1 0 1 0 0 2 1 1 0 0 0 0-2m-2 1a2 2 0 1 1 4 0 2 2 0 0 1-4 0" />
                            </svg></span>
                    </a>

                    <a href="#" class="btn btn-primary d-none d-lg-inline-flex">
                        Entrar
                    </a>
                    <button class="navbar-toggler border-0 p-2" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#menuMobile" aria-controls="menuMobile" aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="d-lg-none">
            <div class="collapse" id="buscaMobile">
                <form class="container d-flex gap-2 pb-3" role="search">
                    <input type="search" name="q" class="form-control" placeholder="Buscar produtos..."
                        aria-label="Buscar produtos">
                    <button type="submit" class="btn btn-primary">
                        Buscar
                    </button>
                </form>
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-end menu-mobile" tabindex="-1" id="menuMobile" aria-labelledby="menuMobileTitulo">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuMobileTitulo">
                PD Sports
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>
        </div>

        <div class="offcanvas-body">
            <nav class="nav flex-column gap-3 align-items-center w-100" aria-label="Menu mobile">
                <a href="./index.html" class="nav-link" aria-current="page">
                    Início
                </a>
                <a href="#" class="nav-link">Produtos</a>
                <a href="#" class="btn btn-primary w-100">Entrar</a>
            </nav>
        </div>
    </div>

    <main class="container my-5 text-center">
        <p class="text-muted">Veja os dados no console: <code>CTRL + SHIFT + I</code> ou <code>F12</code>.</p>

        <article class="card product-card d-flex justify-content-between">
            <figure>
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                    alt="Imagem do produto">
            </figure>
            <div class="card-bottom">
                <p class="product-name">Nome do produto</p>
                <p class="product-price">R$ 99,90</p>
                <a href="" class="btn btn-primary">Ver detalhes</a>
            </div>

        </article>
    </main>

    <footer>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script type="module">
        import { carregarCatalogo } from "./js/servicos/catalogo.js";

        try {
            const { modalidades, produtos } = await carregarCatalogo();

            console.log("Modalidades:", modalidades);
            console.log(`Produtos (${produtos.length}):`, produtos);
        } catch (erro) {
            console.error("Falha ao carregar o catálogo:", erro);
        }
    </script>
</body>

</html>
