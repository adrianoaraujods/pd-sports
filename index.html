<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PD Sports</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
      integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./assets/css/navbar.css" />
    <link rel="stylesheet" href="./assets/css/footer.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400&display=swap"
    />
    <link rel="stylesheet" href="./assets/css/card.css" />
    <link rel="stylesheet" href="./assets/css/index.css" />
  </head>

  <body class="d-flex flex-column min-vh-100">
    <header id="navbar">
      <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
        <div class="container" id="navbarConteudo">
          <a href="./index.html" class="navbar-brand">
            <img src="./assets/imagens/logo.png" alt="logo" /> PD Sports
          </a>

          <div
            class="d-flex align-items-center gap-1 ms-auto ms-lg-0 order-lg-last"
          >
            <button
              class="btn text-white fs-4 lh-1 p-2 d-lg-none"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#buscaNavbar"
              aria-controls="buscaNavbar"
              aria-expanded="false"
              aria-label="Abrir busca"
            >
              <i class="bi bi-search" aria-hidden="true"></i>
            </button>
            <a
              href="#"
              class="btn text-white fs-4 lh-1 p-2"
              aria-label="Carrinho"
              ><i class="bi bi-cart4" aria-hidden="true"></i
            ></a>
            <a
              href="./paginas/login.html"
              class="btn btn-primary ms-1 d-none d-lg-inline-flex"
              >Entrar</a
            >
            <button
              class="btn text-white fs-4 lh-1 p-2 d-lg-none"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#menuNavbar"
              aria-controls="menuNavbar"
              aria-expanded="false"
              aria-label="Abrir menu"
            >
              <i class="bi bi-list" aria-hidden="true"></i>
            </button>
          </div>

          <div
            class="collapse navbar-collapse"
            id="menuNavbar"
            data-bs-parent="#navbarConteudo"
          >
            <ul class="navbar-nav me-lg-auto">
              <li class="nav-item">
                <a
                  href="./index.html"
                  class="nav-link active"
                  aria-current="page"
                  >Início</a
                >
              </li>
              <li class="nav-item">
                <a href="./paginas/catalogo.html" class="nav-link">Produtos</a>
              </li>
            </ul>
            <a
              href="./paginas/login.html"
              class="btn btn-primary d-lg-none my-2"
              >Entrar</a
            >
            <form class="d-none d-lg-flex" role="search">
              <input
                type="search"
                name="q"
                class="form-control"
                placeholder="Buscar produtos..."
                aria-label="Buscar produtos"
              />
            </form>
          </div>

          <div
            class="collapse d-lg-none w-100"
            id="buscaNavbar"
            data-bs-parent="#navbarConteudo"
          >
            <form class="d-flex gap-2 py-2" role="search">
              <input
                type="search"
                name="q"
                class="form-control"
                placeholder="Buscar produtos..."
                aria-label="Buscar produtos"
              />
              <button type="submit" class="btn btn-primary">Buscar</button>
            </form>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-5 text-center flex-grow-1">
      <section>
        <h2 class="text-start my-3 titulo-secao">Produtos em alta</h2>
        <p id="status-destaques" role="status"></p>
        <div class="d-flex">
          <button class="btn nav-destaques" id="destaques-anterior">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              fill="currentColor"
              class="bi bi-chevron-left"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"
              />
            </svg>
          </button>
          <div class="cards-wrapper container d-flex"></div>
          <button class="btn nav-destaques" id="destaques-proximo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="40"
              height="40"
              fill="currentColor"
              class="bi bi-chevron-right"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"
              />
            </svg>
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer text-white">
      <div class="container py-4">
        <div class="row g-4">
          <div class="col-12 col-lg-6">
            <h2 class="h4 fw-bold">PD Sports</h2>
            <p>Os melhores produtos para atletas</p>

            <div class="d-flex align-items-center gap-3">
              <a href="#" class="text-white" aria-label="Instagram">
                <i class="bi bi-instagram fs-4" aria-hidden="true"></i>
              </a>
              <a href="#" class="text-white" aria-label="X">
                <i class="bi bi-twitter-x fs-4" aria-hidden="true"></i>
              </a>
              <a href="#" class="text-white" aria-label="LinkedIn">
                <i class="bi bi-linkedin fs-4" aria-hidden="true"></i>
              </a>
            </div>
          </div>

          <div class="col-6 col-lg-3">
            <h2 class="h6 fw-bold text-uppercase mb-3">Menu</h2>

            <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
              <li>
                <a href="./index.html" class="text-white"> Início </a>
              </li>
              <li>
                <a href="./paginas/catalogo.html" class="text-white"
                  >Produtos</a
                >
              </li>
              <li>
                <a href="#" class="text-white">Seu carrinho</a>
              </li>
            </ul>
          </div>

          <div class="col-6 col-lg-3">
            <h2 class="h6 fw-bold text-uppercase mb-3">Informações</h2>

            <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
              <li>
                <a href="#" class="text-white"> Política de Privacidade </a>
              </li>
              <li>
                <a href="#" class="text-white"> Informações Legais </a>
              </li>
            </ul>
          </div>
        </div>
      </div>

      <div class="footer-copyright text-center px-3 py-2">
        <small>© 2026 PD Sports. Todos os direitos reservados.</small>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script type="module">
      import { carregarCatalogo } from "./js/servicos/catalogo.js";

      try {
        const { modalidades, produtos } = await carregarCatalogo();

        console.log("Modalidades:", modalidades);
        console.log(`Produtos (${produtos.length}):`, produtos);
      } catch (erro) {
        console.error("Falha ao carregar o catálogo:", erro);
      }
    </script>
    <script type="module" src="./js/componentes/navbar.js"></script>
    <script
      type="module"
      src="./js/componentes/carrossel-destaques.js"
    ></script>
  </body>
</html>
