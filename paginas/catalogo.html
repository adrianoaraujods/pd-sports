<!DOCTYPE html>

    <link rel="stylesheet" href="../assets/css/navbar.css">
    <link rel="stylesheet" href="../assets/css/footer.css">
    <link rel="stylesheet" href="../assets/css/card.css">
    <link rel="stylesheet" href="../assets/css/estilos.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vend+Sans:wght@400&display=swap">

    <title>Catálogo</title>

<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark">
            <div class="container">

                <a href="../index.html" class="navbar-brand">
                    <img src="../assets/imagens/logo.png" alt="logo" class="logo-img">
                    PD Sports
                </a>

                <ul class="navbar-nav me-auto d-none d-lg-flex">
                    <li class="nav-item">
                        <a href="../index.html" class="nav-link active" aria-current="page">
                            Início
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link">Produtos</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <form class="d-none d-lg-flex" role="search">
                        <input type="search" name="q" class="form-control" placeholder="Buscar produtos..."
                            aria-label="Buscar produtos">
                    </form>

                    <button class="btn text-white d-lg-none p-2" type="button" data-bs-toggle="collapse"
                        data-bs-target="#buscaMobile" aria-controls="buscaMobile" aria-expanded="false"
                        aria-label="Abrir busca">
                        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path

                    </button>
                    <a href="#" class="text-white" aria-label="Carrinho">
                        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                fill="currentColor" class="bi bi-cart4" viewBox="0 0 16 16">
                                <path

                            </svg></span>
                    </a>

                    <a href="#" class="btn btn-primary d-none d-lg-inline-flex">
                        Entrar
                    </a>
                    <button class="navbar-toggler border-0 p-2" type="button" data-bs-toggle="offcanvas"
                        data-bs-target="#menuMobile" aria-controls="menuMobile" aria-label="Abrir menu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
            </div>
        </nav>

        <div class="d-lg-none">
            <div class="collapse" id="buscaMobile">
                <form class="container d-flex gap-2 pb-3" role="search">
                    <input type="search" name="q" class="form-control" placeholder="Buscar produtos..."
                        aria-label="Buscar produtos">
                    <button type="submit" class="btn btn-primary">
                        Buscar
                    </button>
                </form>
            </div>
        </div>

        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="menuMobileTitulo">

            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar menu"></button>
        </div>

        <div class="offcanvas-body">
            <nav class="nav flex-column gap-3 align-items-center w-100" aria-label="Menu mobile">
                <a href="../index.html" class="nav-link" aria-current="page">
                    Início
                </a>
                <a href="./paginas/catalogo.html" class="nav-link">Produtos</a>
                <a href="#" class="btn btn-primary w-100">Entrar</a>
            </nav>
        </div>
    </div>

            <div id="lista-produtos" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4"></div>

                    <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
                        <li>

                        </li>
                        <li>
